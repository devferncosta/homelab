name: homelab-opengym

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:${OPENGYM_VERSION:?Set OPENGYM_VERSION in .env}
    restart: always
    environment:
      DATA_DIR: /data
      RP_ID: "${OPENGYM_RP_ID:-localhost}"
      ORIGIN: "${OPENGYM_ORIGIN:-http://localhost:${OPENGYM_PORT:-8080}}"
      TRUST_PROXY: "1"
      FIRST_USER_ADMIN: "1"
      ALLOW_GUEST: "0"
      INVITE_ONLY: "${OPENGYM_INVITE_ONLY:-0}"
      PASSWORD_LOGIN: "${OPENGYM_PASSWORD_LOGIN:-0}"
      COACH_CHATGPT_PLAN: "${COACH_CHATGPT_PLAN:-off}"
      MCP: "${MCP:-off}"
    volumes:
      - type: bind
        source: "${OPENGYM_DATA_DIR:-./data}"
        target: /data

  web:
    image: ghcr.io/duartesantos8/opengym-web:${OPENGYM_VERSION:?Set OPENGYM_VERSION in .env}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OPENGYM_PORT:-8080}:80"

  mcp:
    profiles: [mcp]
    image: ghcr.io/duartesantos8/opengym-mcp:${OPENGYM_VERSION:?Set OPENGYM_VERSION in .env}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      OPENGYM_API_URL: http://api:3000
      ORIGIN: "${OPENGYM_ORIGIN:-http://localhost:${OPENGYM_PORT:-8080}}"

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.11.1
    restart: always
    depends_on:
      web:
        condition: service_healthy
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    volumes:
      - type: bind
        source: "${OPENGYM_TUNNEL_CONFIG:-./secrets/cloudflared.yml}"
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${OPENGYM_TUNNEL_CREDENTIALS:-./secrets/cloudflared.json}"
        target: /etc/cloudflared/credentials.json
        read_only: true
        bind:
          create_host_path: false
